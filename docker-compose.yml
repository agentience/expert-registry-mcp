version: '3.8'

services:
  expert-registry-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: expert-registry-mcp
    restart: unless-stopped
    env_file:
      - config/docker.env
    environment:
      # Override any environment variables if needed
      - EXPERT_SYSTEM_PATH=/app/expert-system
      - MCP_TRANSPORT=sse
      - MCP_SSE_HOST=0.0.0.0
      - MCP_SSE_PORT=8000
    
    volumes:
      # Map expert system data to host for easy editing and persistence
      - ./expert-system:/app/expert-system:rw
      - ./chroma_db:/app/chroma_db:rw
      
      # Optional: Mount for custom configurations
      - ./config:/app/config:ro
    
    networks:
      - expert-registry-network
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Expose port for SSE transport and health checks
    ports:
      - "8080:8000"  # MCP server SSE transport (changed to avoid conflict with admin API)

  # Optional: Redis for caching (can be enabled if needed)
  redis:
    image: redis:7-alpine
    container_name: expert-registry-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - expert-registry-network
    profiles:
      - with-redis

volumes:
  redis_data:
    driver: local

networks:
  expert-registry-network:
    driver: bridge
    name: expert-registry-network